<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>영상통화 연결 테스트</title>
  <style>
    :root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#252525;background:#f6f3ed}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px}
    main{width:min(440px,100%);background:#fff;border-radius:24px;padding:28px 24px;box-shadow:0 16px 60px #1b1b1b12}
    h1{font-size:23px;margin:0 0 10px}p{line-height:1.6;color:#535353;margin:0 0 22px}
    #status{background:#f2f1ee;border-radius:14px;padding:15px;min-height:55px;white-space:pre-wrap;font-size:15px;line-height:1.5}
    #status[data-state="error"]{background:#fff2ef;color:#a12c1d}
    #status[data-state="success"]{background:#eaf9ef;color:#176734}
    .actions{display:flex;gap:10px;margin-top:20px}button{border:0;border-radius:13px;padding:14px;font:inherit;font-weight:700;cursor:pointer;flex:1}
    #join{background:#212121;color:#fff}#leave{background:#eae7e1;color:#333}button:disabled{opacity:.45;cursor:default}
    #media{position:relative;margin-top:16px;display:none;aspect-ratio:368/560;width:100%;background:#161616;border-radius:16px;overflow:hidden}
    #media video{width:100%;height:100%;object-fit:cover}#media audio{display:none}
    small{display:block;margin-top:16px;color:#777;line-height:1.55}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js" defer></script>
</head>
<body>
<main>
  <h1>영상통화 연결 테스트</h1>
  <p>기존 앱은 건드리지 않고, 이 브라우저가 LiveKit에 연결되는지만 확인해요.</p>
  <div id="status" role="status" aria-live="polite">준비 완료. 아래 버튼을 눌러주세요.</div>
  <div class="actions">
    <button id="join">연결 테스트</button>
    <button id="leave" disabled>연결 종료</button>
  </div>
  <div id="media" aria-label="아바타 수신 영상"></div>
  <small>지금은 영상 제공 AI 에이전트가 아직 없으므로 연결에 성공해도 아바타 영상은 나오지 않는 게 정상이에요. API 키, 토큰, 개인정보를 화면에 표시하지 않습니다.</small>
</main>
<script>
'use strict';
(() => {
  const status = document.getElementById('status');
  const join = document.getElementById('join');
  const leave = document.getElementById('leave');
  const media = document.getElementById('media');
  let room = null;

  function message(text, state = '') {
    status.textContent = text;
    status.dataset.state = state;
  }

  async function closeRoom() {
    if (room) {
      const old = room;
      room = null;
      try { await old.disconnect(); } catch (_) {}
    }
    media.querySelectorAll('video,audio').forEach(el => { el.pause(); el.remove(); });
    media.style.display = 'none';
    join.disabled = false;
    leave.disabled = true;
  }

  join.addEventListener('click', async () => {
    join.disabled = true;
    message('연결 토큰 요청 중…');
    try {
      if (!window.LivekitClient) {
        throw new Error('브라우저용 LiveKit 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.');
      }
      const response = await fetch('/api/livekit/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: '{}',
        cache: 'no-store'
      });
      if (!response.ok) throw new Error('토큰 발급 실패 (HTTP ' + response.status + ')');
      const info = await response.json();
      if (!info.server_url || !info.participant_token) {
        throw new Error('서버 응답에 접속 정보가 없습니다.');
      }

      const lk = window.LivekitClient;
      room = new lk.Room({ adaptiveStream: true, autoSubscribe: true });
      room.on(lk.RoomEvent.TrackSubscribed, (track) => {
        if (track.kind !== lk.Track.Kind.Video && track.kind !== lk.Track.Kind.Audio) return;
        const el = track.attach();
        if (track.kind === lk.Track.Kind.Video) {
          el.autoplay = true;
          el.playsInline = true;
          media.style.display = 'block';
        }
        media.appendChild(el);
      });
      room.on(lk.RoomEvent.TrackUnsubscribed, track => {
        for (const el of track.detach()) el.remove();
        if (!media.querySelector('video')) media.style.display = 'none';
      });
      room.on(lk.RoomEvent.Disconnected, () => {
        closeRoom().then(() => message('연결이 종료되었습니다.'));
      });
      message('LiveKit 서버에 접속하는 중…');
      await room.connect(info.server_url, info.participant_token);
      message('성공! LiveKit 영상통화 방에 연결됐습니다.\n아바타 영상은 다음 단계에서 연결합니다.', 'success');
      leave.disabled = false;
    } catch (err) {
      await closeRoom();
      message('연결 실패: ' + (err && err.message ? err.message : String(err)), 'error');
    }
  });

  leave.addEventListener('click', async () => {
    await closeRoom();
    message('연결을 종료했습니다.');
  });
  window.addEventListener('pagehide', () => {
    if (room) room.disconnect().catch(() => {});
  });
})();
</script>
</body>
</html>
