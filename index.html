<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f7f4ee" />
  <title>브릿지</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <style>
    :root{
      --bg:#f6f3ed; --card:#fffdfa; --ink:#171717; --muted:#6b6b6b; --line:#ded9cf;
      --accent:#3d6f66; --accent-soft:#e6f0ed; --danger:#b43a3a; --shadow:0 14px 40px rgba(36,31,24,.09);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}
    body{display:flex;justify-content:center}
    button,input,textarea{font:inherit}
    button{cursor:pointer}
    .app{width:min(100%,520px);min-height:100vh;background:var(--bg);position:relative;overflow:hidden}
    .screen{display:none;min-height:100vh;padding:26px 22px calc(30px + env(safe-area-inset-bottom));animation:fade .18s ease}
    .screen.active{display:block}
    @keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
    .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
    .back{border:0;background:transparent;font-size:34px;line-height:1;padding:4px 10px 4px 0;color:var(--ink)}
    .step{font-size:15px;color:var(--muted);font-weight:700}
    h1,h2,p{margin:0}
    h1{font-size:34px;letter-spacing:-.04em;line-height:1.18}
    h2{font-size:28px;letter-spacing:-.035em;line-height:1.25}
    .sub{margin-top:10px;color:var(--muted);font-size:18px;line-height:1.55}
    .home.active{display:flex;flex-direction:column;justify-content:center;gap:20px;min-height:100vh;padding:34px 24px}
    .brand{margin-bottom:10px;text-align:center}
    .brand .small{font-size:17px;color:var(--muted);margin-top:8px}
    .homebtn{width:100%;min-height:210px;border:1.5px solid var(--line);background:var(--card);border-radius:28px;padding:28px 24px;text-align:left;box-shadow:var(--shadow);display:flex;align-items:center;gap:20px}
    .homebtn:active{transform:scale(.99)}
    .homeicon{width:78px;height:78px;border-radius:24px;background:var(--accent-soft);display:grid;place-items:center;font-size:38px;flex:0 0 auto}
    .homebtn strong{display:block;font-size:31px;letter-spacing:-.04em;margin-bottom:8px}
    .homebtn span{font-size:18px;color:var(--muted);line-height:1.45}
    .panel{margin-top:24px;background:var(--card);border:1.5px solid var(--line);border-radius:26px;padding:22px;box-shadow:var(--shadow)}
    .label{display:block;font-size:18px;font-weight:800;margin-bottom:10px}
    .field{width:100%;border:1.5px solid var(--line);background:white;border-radius:18px;padding:17px 18px;font-size:20px;outline:none}
    textarea.field{min-height:150px;resize:vertical;line-height:1.55}
    .field:focus{border-color:var(--accent)}
    .photoBox{width:100%;aspect-ratio:4/3;border:2px dashed #cfc8bb;border-radius:24px;background:#fbfaf7;display:grid;place-items:center;overflow:hidden;position:relative}
    .photoBox img{width:100%;height:100%;object-fit:cover;display:none}
    .photoPrompt{text-align:center;color:var(--muted);font-size:19px;line-height:1.5;padding:20px}
    .photoPrompt b{display:block;color:var(--ink);font-size:24px;margin-bottom:6px}
    .fileInput{display:none}
    .primary{width:100%;border:0;border-radius:20px;background:var(--accent);color:white;padding:20px 18px;font-size:24px;font-weight:900;margin-top:20px}
    .secondary{width:100%;border:1.5px solid var(--line);border-radius:20px;background:var(--card);padding:18px;font-size:21px;font-weight:800;margin-top:12px}
    .choices{display:grid;grid-template-columns:1fr;gap:12px;margin-top:22px}
    .choice{border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:19px 18px;font-size:22px;font-weight:800;text-align:left}
    .choice.selected{border-color:var(--accent);background:var(--accent-soft)}
    .relations{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}
    .relation{border:1.5px solid var(--line);background:var(--card);border-radius:18px;padding:18px 10px;font-size:20px;font-weight:800}
    .relation.selected{border-color:var(--accent);background:var(--accent-soft)}
    .microw{display:flex;gap:10px;align-items:stretch;margin-top:12px}
    .micbtn{width:86px;border:0;border-radius:18px;background:var(--accent-soft);font-size:32px}
    .hint{color:var(--muted);font-size:15px;line-height:1.5;margin-top:10px}
    .targetList{display:grid;gap:14px;margin-top:20px}
    .targetCard{width:100%;display:flex;align-items:center;gap:16px;border:1.5px solid var(--line);background:var(--card);border-radius:22px;padding:16px;text-align:left}
    .targetPhoto{width:84px;height:84px;border-radius:20px;background:#eee7db;object-fit:cover;flex:0 0 auto}
    .targetName{font-size:25px;font-weight:900}
    .targetRel{font-size:17px;color:var(--muted);margin-top:4px}
    .callScreen{padding:0;background:#111;min-height:100vh;color:white}
    .callStage{min-height:100vh;display:flex;flex-direction:column;position:relative;background:linear-gradient(180deg,#151515,#0b0b0b)}
    .callTop{padding:calc(20px + env(safe-area-inset-top)) 22px 16px;position:absolute;top:0;left:0;right:0;z-index:5;background:linear-gradient(180deg,rgba(0,0,0,.62),transparent)}
    .callName{font-size:26px;font-weight:900;text-align:center}
    .callStatus{font-size:15px;opacity:.8;text-align:center;margin-top:4px}
    .avatarArea{flex:1;display:grid;place-items:center;overflow:hidden;position:relative}
    .avatarArea img{width:100%;height:100vh;object-fit:cover;filter:saturate(.94);transform:scale(1.03)}
    .avatarArea.talking img{animation:gentleTalk 2.2s ease-in-out infinite}
    @keyframes gentleTalk{0%,100%{transform:scale(1.03) translateY(0)}50%{transform:scale(1.045) translateY(-5px)}}
    .avatarFallback{width:220px;height:220px;border-radius:50%;background:#d8d1c5;display:grid;place-items:center;font-size:92px;color:#4c4943}
    .caption{position:absolute;left:18px;right:18px;bottom:150px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);border-radius:18px;padding:16px 18px;text-align:center;font-size:20px;line-height:1.5;min-height:62px}
    .callControls{position:absolute;left:0;right:0;bottom:0;padding:18px 22px calc(22px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:18px;background:linear-gradient(0deg,rgba(0,0,0,.74),transparent)}
    .round{width:82px;height:82px;border-radius:50%;border:0;font-size:31px;font-weight:900;background:white;color:#111}
    .hang{background:#d84444;color:white}
    .listening{background:#8cc8b9}
    .saveMark{width:110px;height:110px;border-radius:50%;margin:36px auto 18px;background:var(--accent-soft);display:grid;place-items:center;font-size:52px;color:var(--accent)}
    .center{text-align:center}
    .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:white;padding:12px 16px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:.2s;z-index:99}
    .toast.show{opacity:1}
    @media (max-width:390px){.homebtn{min-height:190px}.homebtn strong{font-size:28px}.homeicon{width:68px;height:68px}.screen{padding-left:18px;padding-right:18px}}
  </style>
</head>
<body>
<div class="app">
  <section id="home" class="screen active home">
    <div class="brand">
      <h1>오늘은 누구와<br>이야기할까요?</h1>
    </div>
    <button class="homebtn" id="startCallBtn">
      <div class="homeicon">📞</div>
      <div><strong>영상통화 시작</strong><span>만들어 둔 대상과 대화하기</span></div>
    </button>
    <button class="homebtn" id="createBtn">
      <div class="homeicon">＋</div>
      <div><strong>대상 만들기</strong><span>새로운 대화 상대 만들기</span></div>
    </button>
  </section>

  <section id="chooseTarget" class="screen">
    <div class="top"><button class="back" data-go="home">‹</button><span class="step">대상 선택</span><span></span></div>
    <h2>누구와 통화할까요?</h2>
    <p class="sub">대상을 한 번 눌러주세요.</p>
    <div id="targetList" class="targetList"></div>
  </section>

  <section id="create1" class="screen">
    <div class="top"><button class="back" data-go="home">‹</button><span class="step">1 / 4</span><span></span></div>
    <h2>사진 또는 외형을<br>선택해주세요.</h2>
    <div class="panel">
      <label class="photoBox" for="photoInput">
        <img id="photoPreview" alt="대상 사진 미리보기" />
        <div id="photoPrompt" class="photoPrompt"><b>사진 선택</b>휴대폰에 있는 사진을 선택하세요.</div>
      </label>
      <input id="photoInput" class="fileInput" type="file" accept="image/*" capture="environment" />
      <label class="label" for="nameInput" style="margin-top:20px">대상 이름</label>
      <input id="nameInput" class="field" placeholder="예: 어머니" autocomplete="off" />
    </div>
    <button class="primary" id="toCreate2">다음</button>
  </section>

  <section id="create2" class="screen">
    <div class="top"><button class="back" data-go="create1">‹</button><span class="step">2 / 4</span><span></span></div>
    <h2>목소리를<br>선택해주세요.</h2>
    <div id="voiceChoices" class="choices">
      <button class="choice selected" data-voice="부드러운 목소리">● 부드러운 목소리</button>
      <button class="choice" data-voice="차분한 목소리">● 차분한 목소리</button>
      <button class="choice" data-voice="활기찬 목소리">● 활기찬 목소리</button>
    </div>
    <button class="primary" id="toCreate3">다음</button>
  </section>

  <section id="create3" class="screen">
    <div class="top"><button class="back" data-go="create2">‹</button><span class="step">3 / 4</span><span></span></div>
    <h2>관계와 성격을<br>알려주세요.</h2>
    <div class="relations" id="relationChoices">
      <button class="relation" data-rel="어머니">어머니</button><button class="relation" data-rel="아버지">아버지</button>
      <button class="relation" data-rel="배우자">배우자</button><button class="relation" data-rel="친구">친구</button>
      <button class="relation" data-rel="자녀">자녀</button><button class="relation" data-rel="기타">기타</button>
    </div>
    <label class="label" for="personalityInput">성격</label>
    <textarea id="personalityInput" class="field" placeholder="예: 따뜻하고 다정하며, 농담을 자주 해요."></textarea>
    <button class="primary" id="toCreate4">다음</button>
  </section>

  <section id="create4" class="screen">
    <div class="top"><button class="back" data-go="create3">‹</button><span class="step">4 / 4</span><span></span></div>
    <h2>기억해줬으면 하는<br>이야기를 들려주세요.</h2>
    <p class="sub">말로 이야기해도 됩니다.</p>
    <div class="panel">
      <textarea id="memoryInput" class="field" placeholder="예: 젊었을 때 함께 제주도 여행을 갔어요."></textarea>
      <div class="microw"><button id="memoryMic" class="micbtn" aria-label="음성 입력">🎙️</button><button id="addMemory" class="secondary" style="margin:0">이 이야기 추가</button></div>
      <div class="hint">여러 이야기를 추가할 수 있어요.</div>
      <div id="memoryList" style="margin-top:14px"></div>
    </div>
    <button class="primary" id="saveTarget">대상 저장</button>
  </section>

  <section id="saved" class="screen">
    <div class="saveMark">✓</div>
    <div class="center"><h2>대상이 저장되었습니다.</h2><p class="sub">이제 영상통화를 시작할 수 있어요.</p></div>
    <button class="primary" data-go="home" style="margin-top:34px">메인 화면으로 돌아가기</button>
  </section>

  <section id="call" class="screen callScreen">
    <div class="callStage">
      <div class="callTop"><div id="callName" class="callName">대상</div><div id="callStatus" class="callStatus">연결됨</div></div>
      <div id="avatarArea" class="avatarArea"><img id="callPhoto" alt="아바타"/><div id="avatarFallback" class="avatarFallback">☺</div></div>
      <div id="caption" class="caption">마이크 버튼을 누르고 말씀해주세요.</div>
      <div class="callControls"><button id="talkBtn" class="round">🎙️</button><button id="hangBtn" class="round hang">☎</button></div>
    </div>
  </section>
</div>
<div id="toast" class="toast"></div>
<script src="/app.js"></script>
</body>
</html>
